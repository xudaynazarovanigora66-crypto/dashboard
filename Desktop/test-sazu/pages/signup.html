<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8ff" />
    <title>Yangi account — Til sinovi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900;1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <script src="auth-demo.js" defer></script>
  </head>
  <body>
    <div class="page auth-page">
      <header class="topbar">
        <a class="brand" href="home.html" aria-label="Bosh sahifa">
          <span class="brand__mark" aria-hidden="true">✦</span>
          <span>til <span class="brand__accent">sinovi!</span></span>
        </a>
        <a class="topbar__tag auth-home-link" href="home.html">← Bosh sahifa</a>
      </header>

      <main class="auth-main">
        <section class="auth-card" aria-labelledby="signup-title">
          <div class="auth-card__icon" aria-hidden="true">✨</div>
          <p class="eyebrow"><span class="eyebrow__dot"></span> YANGI BOSHLANISH</p>
          <h1 id="signup-title">Create account</h1>
          <p class="auth-card__description">Yangi hisob yaratish uchun ma’lumotlarni kiriting.</p>

          <form id="signup-form" data-auth-form="signup">
            <label class="auth-field">
              <span>Ismingiz</span>
              <input name="name" type="text" autocomplete="name" placeholder="Ismingiz" required />
            </label>
            <label class="auth-field">
              <span>Email</span>
              <input name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
            </label>
            <label class="auth-field">
              <span>Parol</span>
              <input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Kamida 8 ta belgi"
                required
              />
            </label>
            <label class="auth-field">
              <span>Parolni qayta kiriting</span>
              <input
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Parolni takrorlang"
                required
              />
            </label>
            <button class="next-button auth-submit" type="submit">Create account</button>
          </form>

          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
          <p class="auth-switch">
            Hisobingiz bormi?
            <a href="login.html">Sign in</a>
          </p>
          <p class="auth-demo-note">
            Bu hozircha demo sahifa. Backend ulanmagan; ma’lumotlaringiz yuborilmaydi va saqlanmaydi.
          </p>
        </section>
      </main>

      <footer class="home-footer auth-footer">
        <a class="brand brand--small" href="home.html">til <span class="brand__accent">sinovi!</span></a>
        <span>© 2026 Til sinovi</span>
      </footer>
    </div>
  </body>
</html>
