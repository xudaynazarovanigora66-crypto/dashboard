<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pizza House menyusi — tanlang va buyurtma bering.">
  <title data-i18n="buy.title">Pitsalar — Pizza House</title>
  <link rel="stylesheet" href="/styles/pizza.css">
  <script src="/js/app.js" defer></script>
  <script src="/js/buy.js" defer></script>
</head>
<body data-page="buy">
  <div data-include="/partials/header.html"></div>
  <main>
    <section class="page-hero buy-hero">
      <div class="container page-hero-content">
        <p class="eyebrow" data-i18n="buy.eyebrow">Pizza House menyusi</p>
        <h1 data-i18n="buy.heading">Bugun qaysi pitsa?</h1>
        <p data-i18n="buy.intro">Sevimli ta’bingizni tanlang — biz uni yangi tayyorlaymiz.</p>
      </div>
    </section>
    <section class="container buy-layout section-space">
      <div class="menu-column">
        <div class="section-heading menu-heading">
          <div><p class="eyebrow" data-i18n="buy.menuEyebrow">Yangi va mazali</p><h2 data-i18n="buy.menuTitle">Bizning pitsalar</h2></div>
          <span class="menu-fresh"><span aria-hidden="true">✦</span> <span data-i18n="buy.fresh">Buyurtmaga tayyorlanadi</span></span>
        </div>
        <div class="product-grid" data-product-list aria-live="polite"></div>
      </div>
      <aside class="cart-panel" id="cart" aria-labelledby="cart-title">
        <div class="cart-panel-heading"><h2 id="cart-title" data-i18n="buy.cartTitle">Savat</h2><span class="cart-count cart-count-large" data-cart-count>0</span></div>
        <div class="cart-items" data-cart-items></div>
        <div class="cart-empty" data-cart-empty>
          <span class="empty-cart-icon" aria-hidden="true">🛒</span>
          <p data-i18n="buy.empty">Savat hozircha bo‘sh.</p>
          <span data-i18n="buy.emptyHint">Pitsalardan birini tanlang.</span>
        </div>
        <div class="cart-summary">
          <div class="cart-total-row"><span data-i18n="buy.total">Jami</span><strong data-cart-total>0 so‘m</strong></div>
          <button class="button button-primary checkout-button" type="button" data-checkout disabled data-i18n="buy.checkout">Buyurtma berish</button>
        </div>
        <p class="order-status" data-order-status role="status" aria-live="polite"></p>
        <form class="checkout-form" data-checkout-form hidden>
          <h3 data-i18n="buy.detailsTitle">Yetkazib berish ma’lumotlari</h3>
          <label><span data-i18n="buy.name">Ismingiz</span><input name="name" autocomplete="name" maxlength="100" required></label>
          <label><span data-i18n="buy.phone">Telefon raqamingiz</span><input name="phone" type="tel" autocomplete="tel" maxlength="40" required></label>
          <label><span data-i18n="buy.address">Yetkazib berish manzili</span><textarea name="address" rows="2" maxlength="300" required></textarea></label>
          <button class="button button-primary checkout-button" type="submit" data-submit-order data-i18n="buy.sendOrder">Buyurtmani yuborish</button>
          <button class="checkout-cancel" type="button" data-cancel-checkout data-i18n="buy.cancel">Bekor qilish</button>
        </form>
      </aside>
    </section>
  </main>
  <div data-include="/partials/footer.html"></div>
</body>
</html>
